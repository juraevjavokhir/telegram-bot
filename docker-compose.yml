services:
  bot:
    build: .
    container_name: zayavka-bot
    restart: always
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      # незаконченные заявки, фото и справочник артикулов — переживают перезапуск
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
